<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search</title>
</head>

<body>
    <header class="site-header">
        <h1>Movie Explorer</h1>

        <p>
            Search for movies and TV shows, or browse what's trending.
        </p>
    </header>

    <main>
        <section class="search-section">
            <form id="search-form">
                <label for="search-input">
                    Search for Movies and TV
                </label>

                <div class="search-bar">
                    <input
                        type="text"
                        id="search-input"
                        placeholder="Enter a movie or TV show"
                        required
                    >

                    <button type="submit">
                        Search
                    </button>
                </div>
            </form>

            <p id="message"></p>

            <section id="movie-results">
                
            </section>
        </section>

        <section class="trending-section">
            <div class="section-heading">
                <h2>Trending Movies</h2>
            </div>

            <div id="trending-movies" class="media-grid">
            </div>
        </section>

        <section class="trending-section">
            <div class="section-heading">
                <h2>Trending TV</h2>
            </div>

            <div id="trending-tv" class="media-grid">
            </div>
        </section>
    </main>
</body>

</html>
