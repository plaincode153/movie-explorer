<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Search</title>
</head>

<body>
    <header>
        <h1>Movie Search</h1>
    </header>

    <main>
        <form id="search-form">
            <label for="search-input">Search for Movies and TV</label>
            <input
                type="text"
                id="search-input"
                placeholder="Enter a movie title"
                required
            >
            <button type="submit">Search</button>
        </form>

        <p id="message"></p>

        <section id="movie-results"></section>
    </main>
</body>
</html>
